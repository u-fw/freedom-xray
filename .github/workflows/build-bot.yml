name: Build Freedom Bot

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/release-trigger'

concurrency:
  group: freedom-bot-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          # Use a supported release with current standard-library security fixes.
          go-version: '1.26'
          cache-dependency-path: bot/go.sum

      - name: Validate scripts and English-first source
        shell: bash
        run: |
          set -euo pipefail
          bash -n freedom.sh 1stream.sh
          python3 - <<'PY'
          from pathlib import Path
          import re
          paths = [Path("README.md"), Path("freedom.sh"), *Path("bot").glob("*.go")]
          for path in paths:
              if re.search(r"[\u4e00-\u9fff]", path.read_text(encoding="utf-8")):
                  raise SystemExit(f"Non-English text found in default source: {path}")
          print("English-first source validation passed")
          PY

      - name: Verify dependency integrity
        working-directory: bot
        run: go mod verify

      - name: Verify Bot before publishing
        working-directory: bot
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then printf 'Run gofmt on:\n%s\n' "$unformatted"; exit 1; fi
          go vet ./...
          go test ./...
          go test -race ./...

      - name: Build Binaries
        id: build_binaries
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p dist
          cd bot

          COMMIT=$(git rev-parse --short=12 HEAD)
          BUILD_TIME=$(date -u +%Y-%m-%d)
          BOT_VERSION=$(awk -F'"' '/^[[:space:]]*Version[[:space:]]*=/{print $2; exit}' main.go)
          [[ "$BOT_VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
            echo "Bot version must be a stable vMAJOR.MINOR.PATCH" >&2
            exit 1
          }
          echo "bot_version=$BOT_VERSION" >> "$GITHUB_OUTPUT"
          LDFLAGS="-s -w -X main.Commit=${COMMIT} -X main.BuildTime=${BUILD_TIME}"

          echo "Building linux/amd64..."
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="${LDFLAGS}" -o ../dist/freedom-bot-linux-amd64 .

          echo "Building linux/arm64..."
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="${LDFLAGS}" -o ../dist/freedom-bot-linux-arm64 .

          cd ../dist
          sha256sum freedom-bot-linux-amd64 > freedom-bot-linux-amd64.sha256
          sha256sum freedom-bot-linux-arm64 > freedom-bot-linux-arm64.sha256
          ls -lh

      - name: Upload Artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: freedom-bot-binaries
          path: dist/*
          retention-days: 7

      - name: Verify Bot source has not been superseded
        id: latest
        shell: bash
        run: |
          set -euo pipefail
          git fetch --quiet --depth=1 origin main
          built_tree="$(git rev-parse HEAD:bot)"
          latest_tree="$(git rev-parse FETCH_HEAD:bot)"
          if [[ "$built_tree" == "$latest_tree" ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Skipping stale Bot artifact release: bot source has changed."
          fi
      - name: Publish immutable versioned release
        if: github.ref == 'refs/heads/main' && steps.latest.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BOT_VERSION: ${{ steps.build_binaries.outputs.bot_version }}
        run: |
          set -euo pipefail
          tag="bot-${BOT_VERSION}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null; then
            git fetch --quiet --depth=1 origin "refs/tags/${tag}"
            if [[ "$(git rev-parse FETCH_HEAD:bot)" != "$(git rev-parse HEAD:bot)" ]]; then
              echo "${tag} already exists for different Bot source; increase the version." >&2
              exit 1
            fi
            gh release view "$tag" >/dev/null || { echo "Existing tag has no release; manual investigation required." >&2; exit 1; }
            echo "Versioned release already exists for this Bot source; leaving its assets unchanged."
          else
            gh release create "$tag" dist/freedom-bot-linux-* \
              --target "$GITHUB_SHA" --title "Freedom Bot ${BOT_VERSION}" --latest=false \
              --notes "Immutable release of freedom-bot ${BOT_VERSION}. Source commit: ${GITHUB_SHA}. Verify the matching SHA-256 checksum before installing."
          fi
      - name: Publish Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        if: github.ref == 'refs/heads/main' && steps.latest.outputs.publish == 'true'
        with:
          tag_name: bot-latest
          name: Freedom Bot Latest Release
          body: |
            Automated build of `freedom-bot` (Telegram Bot for freedom.sh & Xray-core).
            Commit: ${{ github.sha }}
            Version: ${{ steps.build_binaries.outputs.bot_version }}

            ### Binaries & Verification
            - `freedom-bot-linux-amd64`
            - `freedom-bot-linux-arm64`

            Designed for zero-dependency standalone execution managed via `freedom.sh`.
          files: |
            dist/freedom-bot-linux-amd64
            dist/freedom-bot-linux-amd64.sha256
            dist/freedom-bot-linux-arm64
            dist/freedom-bot-linux-arm64.sha256
          make_latest: false
          overwrite_files: true
