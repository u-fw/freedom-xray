name: Source validation
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Parse asset and installation scripts without network or system changes
        run: |
          for script in 1stream.sh freedom.sh; do bash -n "$script"; done
          bash tests/cli-bindings.sh

  bot-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          # go.mod records the minimum language version; CI uses a supported toolchain.
          go-version: '1.26'
          cache-dependency-path: bot/go.sum
      - name: Check Bot formatting and vet
        working-directory: bot
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then printf 'Run gofmt on:\n%s\n' "$unformatted"; exit 1; fi
          go vet ./...
      - name: Test Telegram bot export
        working-directory: bot
        run: |
          go mod verify
          go test ./...
          go test -race ./...
