name: Source validation
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Parse asset and installation scripts without network or system changes
        run: |
          for script in 1stream.sh freedom.sh; do bash -n "$script"; done

  bot-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: bot/go.mod
          cache-dependency-path: bot/go.sum
      - name: Test Telegram bot export
        working-directory: bot
        run: |
          go mod verify
          go test ./...
          go test -race ./...
